name: Build and push Docker image

# Image tags (docker/metadata-action, the same scheme as tradio):
#   every build      ashutoshsao/orin-api:<full commit sha>
#   git tag v1.2.0   also :1.2.0
#   main             also :latest  (convenience only)
# 06-api.yml pins a version or a sha, never :latest: deploying is `kubectl apply -f` with a new tag, and a
# rollback is the previous tag. Only main and version tags build, so :latest can't move to a feature branch.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ashutoshsao/orin-api
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Runners are amd64, which is what GKE nodes are — building here avoids the
      # cross-compile a local `docker build` on an Apple-silicon Mac needs.
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GET /health reports which version is running (the status page and valor show it)
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
