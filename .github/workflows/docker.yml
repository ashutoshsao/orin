name: Build and push Docker image

# Only `main` — this image is what the cluster runs, and `:latest` moving on a feature branch
# would mean the next `rollout restart` deploys whatever was pushed last. Manual runs allowed.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Runners are amd64, which is what GKE nodes are — building here avoids the
      # cross-compile a local `docker build` on an Apple-silicon Mac needs.
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # `:latest` is what 06-api.yml pulls; the sha tag is the rollback handle
          # (`k set image deploy/api api=ashutoshsao/orin-api:<sha> -n orin-app`).
          tags: |
            ashutoshsao/orin-api:latest
            ashutoshsao/orin-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
